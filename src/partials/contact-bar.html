  marker just before the closing body tag on every page.

  - Desktop (sm and up): three small floating circular buttons, bottom-right
    (WhatsApp, Call, LinkedIn).
  - Mobile (below sm): a sticky bottom action bar instead, since a tiny
    floating circle is a harder tap target on a phone. Only one of the two
    is visible at a time (Tailwind's sm:hidden / hidden sm:flex).

  Numbers/URLs here come from src/js/config.js at runtime is unnecessary for
  something this static - they're written directly as real <a href> links
  so they work even before/without JavaScript. Call and WhatsApp deliberately
  use the same number (+91 97179 46234).
-->
